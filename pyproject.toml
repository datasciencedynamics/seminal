[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seminal"
version = "0.0.1a1"
description = "Published risk equations and reference distributions in andrology and male reproductive health: azoospermia probability from FSH (Tradewell et al. 2022) and WHO 2021 semen reference centiles (Campbell et al. 2021)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leonid Shpaner", email = "lshpaner@ucla.edu" }]
requires-python = ">=3.8"
dependencies = ["numpy>=1.20", "pandas>=1.3"]
keywords = ["andrology", "urology", "male infertility", "azoospermia", "fsh", "semen analysis", "who 2021", "reference values", "risk prediction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "build", "twine", "nbstripout"]
data = ["requests", "typer", "pyarrow", "openpyxl", "ipykernel", "matplotlib", "model_metrics", "eda_toolkit", "statsmodels", "scikit-learn", "dcurves"]
docs = ["sphinx", "sphinx-rtd-theme", "sphinx-copybutton", "myst-nb", "ipykernel"]

[project.urls]
Homepage = "https://github.com/datasciencedynamics/seminal"
Documentation = "https://datasciencedynamics.com/seminal"
Issues = "https://github.com/datasciencedynamics/seminal/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/seminal"]
branch = false
